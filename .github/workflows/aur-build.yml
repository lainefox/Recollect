name: AUR Build

on:
  push:
    tags:
      - 'v*'

jobs:
  aur-bin-build:
    name: AUR -bin build (PKGBUILD-bin)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git vala meson ninja \
            glib2 gtk4 libadwaita sqlite tesseract \
            glycin glycin-gtk4 json-glib libsoup3 gdk-pixbuf2 \
            gobject-introspection

      - name: Build native release tarball
        run: |
          # Build the same native release tarball that release.yml produces,
          # so we can test PKGBUILD-bin against it locally. The -bin package is
          # managed by the AUR helper, so disable the in-app update checker.
          meson setup build --prefix=/usr --buildtype=release -Dupdate-checker=false
          meson compile -C build
          meson install -C build --destdir /tmp/stage
          cd /tmp/stage
          tar -czf "$GITHUB_WORKSPACE/recollect-${{ github.ref_name }}.tar.gz" .

      - name: Test PKGBUILD-bin with makepkg
        run: |
          # The -bin PKGBUILD downloads from the GitHub release URL, but the
          # release may not exist yet. Provide a local tarball so makepkg uses
          # it instead of downloading. The filename must match the source URL:
          # $pkgname-$pkgver.tar.gz where pkgver has no 'v' prefix.
          cp build-aux/PKGBUILD-bin PKGBUILD
          cp "recollect-${{ github.ref_name }}.tar.gz" "recollect-bin-${GITHUB_REF_NAME#v}.tar.gz"
          # makepkg refuses to run as root, so create a dedicated build user.
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg -f --noconfirm"