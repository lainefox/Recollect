name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  native-build:
    name: Native build (meson)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y --refresh \
            vala meson ninja-build git \
            gtk4-devel libadwaita-devel \
            sqlite-devel tesseract-devel \
            glycin-devel glycin-gtk4-devel \
            json-glib-devel libsoup3-devel gdk-pixbuf2-devel \
            desktop-file-utils

      - name: Configure
        run: meson setup build --prefix=/usr

      - name: Build
        run: meson compile -C build

      - name: Install (staging)
        run: meson install -C build --destdir /tmp/stage

  aur-build:
    name: AUR build (PKGBUILD)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel git \
            glib2 gtk4 libadwaita sqlite tesseract \
            glycin glycin-gtk4 json-glib libsoup3 gdk-pixbuf2

      - name: Create local source tarball
        run: |
          # The PKGBUILD downloads from a GitHub tag URL that may not exist yet.
          # Provide a local tarball so makepkg uses it instead of downloading.
          mkdir -p /tmp/src/recollect-0.1.0
          cp -a . /tmp/src/recollect-0.1.0/
          rm -rf /tmp/src/recollect-0.1.0/.git /tmp/src/recollect-0.1.0/build /tmp/src/recollect-0.1.0/builddir
          cd /tmp/src
          tar -czf "$GITHUB_WORKSPACE/recollect-0.1.0.tar.gz" recollect-0.1.0

      - name: Build with makepkg
        run: |
          # makepkg refuses to run as root, so create a dedicated build user.
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg -f --noconfirm"