name: Flatpak Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: recollect.flatpak
          manifest-path: build-aux/flatpak/org.laine.Recollect.json
          cache-key: flatpak-builder-${{ github.ref_name }}
          cache: true

      - name: Upload bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: recollect.flatpak
          generate_release_notes: true